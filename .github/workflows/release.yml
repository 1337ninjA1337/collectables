name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Expo/Metro build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            node_modules/.cache
          key: expo-metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: expo-metro-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, not `npx tsc`: npx resolves the pinned
      # devDependency only when node_modules is populated, and otherwise
      # fetches whatever TypeScript is latest on the registry — a different
      # major reports errors the pinned compiler does not. The npm script
      # can only ever run node_modules/.bin/tsc.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: Bundle smoke check
        run: |
          BUNDLE=$(ls dist/_expo/static/js/web/*.js 2>/dev/null | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "ERROR: no web bundle found in dist/_expo/static/js/web/" >&2
            exit 1
          fi
          echo "Checking bundle: $BUNDLE"
          for KEY in marketplaceListOnMarketplace marketplaceTitle addItem createCollection signOut; do
            if ! grep -q "$KEY" "$BUNDLE"; then
              echo "ERROR: expected key '$KEY' not found in bundle" >&2
              exit 1
            fi
          done
          for PROVIDER in MarketplaceProvider CollectionsProvider SocialProvider AuthProvider; do
            if ! grep -q "$PROVIDER" "$BUNDLE"; then
              echo "ERROR: expected provider '$PROVIDER' not found in bundle" >&2
              exit 1
            fi
          done
          echo "Bundle smoke check passed."
