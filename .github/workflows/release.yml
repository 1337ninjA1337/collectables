name: Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1: `npm test` runs
      # __tests__/lint-guard-premise.test.ts, which executes every LINT_GUARDS
      # entry — including lint:baseline-provenance, which compares
      # PRIVACY_BODY_BASELINES against its own previous revision and FAILS in a
      # shallow clone (a pass that checked nothing is not a pass). ci.yml's test
      # job has said so since the guard landed; this job runs the same suites and
      # needs the same history. ci-history-depth.test.ts fails this file back if
      # the depth is ever dropped.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22, not 20: this job runs `npm test`, and every suite importing
      # __tests__/helpers/render.ts needs `module.registerHooks` (Node 22.15).
      # On 20 those suites die at LOAD — 7 reported failures standing in for
      # 127 suites that never ran, with the total count silently 79 lower.
      # ci-node-version.test.ts now fails this file back if the pin drops.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Expo/Metro build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            node_modules/.cache
          key: expo-metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: expo-metro-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck`, not `npx tsc`: npx resolves the pinned
      # devDependency only when node_modules is populated, and otherwise
      # fetches whatever TypeScript is latest on the registry — a different
      # major reports errors the pinned compiler does not. The npm script
      # can only ever run node_modules/.bin/tsc.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Web build
        run: npm run build

      # This copy of the inline shell check had already DRIFTED from ci.yml's:
      # it never grew the six-language loop, so a tree-shaking regression that
      # dropped a translation map failed CI and passed the release gate. One
      # script, one token list.
      - name: Bundle + privacy page smoke check
        run: npm run lint:bundle-smoke
