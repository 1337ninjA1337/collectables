name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The structural guard (lint:peer-dep-free) proves no *static* import of
  # @sentry/react-native in the sentry test surface; this job proves the
  # stronger runtime property — the whole @sentry scope can be absent from
  # node_modules (catching a transitive import via e.g. @sentry/core).
  # The --import setup file is load-bearing: without the global beforeEach
  # reset, module state leaks between suites and produces false failures.
  # It lives in the `test:sentry` script rather than inline here so the
  # flags cannot drift from `npm test`'s.
  #
  # This job deliberately does NOT typecheck, and that asymmetry with the
  # `test` job is intentional in both directions: after `rm -rf`, tsc fails
  # on lib/sentry.ts's `import("@sentry/react-native")` — the types resolve
  # through node_modules even though the import is lazy — so a typecheck
  # here would be red for a reason this job is not testing; and running it
  # BEFORE the deletion only repeats the `test` job's Typecheck step, which
  # covers these same files. Coverage: the `test` job.
  sentry-sdk-absent:
    name: Sentry tests with SDK absent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20: __tests__/helpers/render.ts mounts components using
      # `module.registerHooks`, which landed in 22.15. On 20 every suite that
      # imports the harness fails at load with "registerHooks is not a
      # function" — and `ci-node-version.test.ts` fails this file back if the
      # pin is ever lowered.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Delete the @sentry scope and run the sentry test surface
        run: |
          # `rm -rf` exits 0 whether or not the path was there, so an install
          # layout change (a hoist, a rename, a different package manager)
          # would leave the SDK in place and this job would pass while
          # proving nothing — a vacuous green, the same silent-coverage-loss
          # shape as the Node 20 pin. Assert the premise, then assert the
          # deletion took effect. Both checks go through require.resolve
          # rather than `test -d`: a nested copy under another package
          # resolves perfectly well with the top-level scope gone, which is
          # exactly the case a path check would miss.
          node -e "require.resolve('@sentry/react-native')" || {
            echo "ERROR: @sentry/react-native did not resolve before the delete — nothing for this job to remove" >&2
            exit 1
          }
          rm -rf node_modules/@sentry
          if node -e "require.resolve('@sentry/react-native')" 2>/dev/null; then
            echo "ERROR: @sentry/react-native still resolves after deleting node_modules/@sentry — this job would prove nothing" >&2
            exit 1
          fi
          npm run test:sentry

  test:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth-1: lint:all's
      # lint:baseline-provenance guard compares PRIVACY_BODY_BASELINES against
      # its own previous revision, and a shallow clone has no previous
      # revision to read. The guard FAILS rather than skipping in that case
      # (a pass that checked nothing is not a pass), so this is load-bearing.
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Expo/Metro build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.expo
            node_modules/.cache
          key: expo-metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: expo-metro-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # SEC-8: fail on a high/critical advisory root SECURITY.md has not
      # triaged. This replaced a bare `npm audit --audit-level=high` that had
      # to be `continue-on-error` — the accepted advisories made it red every
      # run, so it reported the same red for an advisory somebody had read and
      # one nobody had ever seen, and thirteen accumulated under a green-looking
      # PR list. Blocking, because it is now silent until something CHANGES.
      # A registry it cannot reach is a soft skip, not a failure.
      - name: Dependency advisory baseline
        run: npm run lint:audit-baseline

      # Fails only on drift in the watched posthog-* packages (pinned
      # manually because the dev sandbox can't reach the Expo registry);
      # other expo-managed drift is advisory, registry outage is a skip.
      - name: Expo-recommended versions (posthog-* watched)
        run: npm run lint:expo-install

      # Kept as its own step even though `npm test` now runs `pretest` →
      # `npm run typecheck`: this fails the run in ~5s instead of after the
      # much slower lint:all fan-out, and gives the failure a named step.
      - name: Typecheck
        run: npm run typecheck

      # All pure code-style guards (inline hex/geometry literals, env
      # inlining, analytics imports, Clarity input masking, migration
      # docs/naming, committed secrets, App Store pre-flight, Sentry SDK
      # pin, privacy baseline provenance, Power BI schema drift) run through
      # one aggregator. The
      # registry in lib/lint-guards.ts is the single source of truth —
      # a guard added there is automatically enforced here — and unlike a
      # step-per-guard chain the aggregator runs EVERY guard even after
      # one fails, so a single CI run surfaces all findings.
      - name: Code-style guards (lint:all)
        run: npm run lint:all

      # `npm test` runs TWO reporters: tap on stdout (the play-by-play, and
      # what any log annotation reads), and scripts/test-failure-reporter.ts on
      # stderr, which stays silent all run and then writes the name of every
      # test that failed. That second one exists because PR #473 reported
      # `# fail 1` of 7213 and the case could not be named: tap prints the name
      # inline, thousands of lines before the end, and its trailer is counts
      # only — so a log tail returned the counts and the only diagnosis
      # available was a re-run. The names are now in the last lines of the job.
      - name: Run tests
        run: npm test

      - name: Web build
        run: npm run build

      - name: No secrets in web bundle
        run: npm run lint:secrets:bundle

      # Fails when the exported JS bundle exceeds the 4.53 MiB budget — catches
      # a heavy SDK (posthog-js, replay tooling) accidentally becoming a static
      # import instead of a lazy import(). Override via BUNDLE_SIZE_BUDGET_BYTES.
      - name: Bundle size within budget
        run: npm run lint:bundle-size

      # Watched i18n keys / providers / language codes are still in the bundle,
      # and the static /privacy page (emitted from PRIVACY.md by
      # build-spa-fallback.ts) survived the build. Previously two inline shell
      # steps; they are one script so they share assertBundlePremise with the
      # two guards above — neither shell version checked that dist/ was newer
      # than the source tree, so both would grep a stale bundle and pass — and
      # so the watched token lists are testable instead of living in YAML.
      - name: Bundle + privacy page smoke check
        run: npm run lint:bundle-smoke
